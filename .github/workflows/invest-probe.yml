name: 자산 API 시험

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/probe_invest.py", ".github/workflows/invest-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: API 시험 호출
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
        run: python scripts/probe_invest.py
